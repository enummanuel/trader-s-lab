<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Started — Traders Lab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                TRADERS LAB
            </a>

            <a href="index.html" class="auth-back">
                ← Back to website
            </a>

            <div class="auth-heading">
                <span class="auth-eyebrow">GET STARTED</span>

                <h1>Create your trading workspace.</h1>

                <p>
                    Start recording your trades, tracking your performance,
                    and building a more consistent trading process.
                </p>
            </div>

            <form class="auth-form" id="signup-form">

                <div class="form-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <p class="auth-message" id="signup-message"></p>

                <button type="submit" class="auth-submit">
                    Create account
                </button>

            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>

                <a href="login.html">
                    Log in
                </a>
            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
