<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log in — Traders Lab</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <div class="auth-card">

      <a href="index.html" class="auth-logo">
        TRADERS LAB
      </a>

      <a href="index.html" class="auth-back">
        ← Back to website
      </a>

      <div class="auth-heading">
        <p class="section-eyebrow">WELCOME BACK</p>

        <h1>
          Log in to your
          <span>trading workspace.</span>
        </h1>

        <p>
          Access your journal, performance, analytics,
          and trading records.
        </p>
      </div>

      <form class="auth-form" id="login-form">

        <div class="input-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="input-group">

          <div class="password-label">
            <label for="password">Password</label>

            <a href="#">Forgot password?</a>
          </div>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>

        <p class="auth-message" id="login-message"></p>

        <button type="submit" class="btn auth-submit">
          Log in
        </button>

      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html">Get started</a>
      </p>

    </div>

  </main>

  <script src="js/auth.js"></script>

</body>
</html>
